paragraph=Vector2 and Vector3 classes with operators, dot and cross products, rotation about any axis, projection and reflection, plus the curves that move things smoothly: lerp, smoothstep, minimum jerk, quadratic and cubic Bézier, and a time-constant low-pass filter. Float only, with constexpr constructors so constant tables cost no RAM. Derived from raylib's raymath.
