# Checks every push and pull request:
#   host-tests  the checks in test/ and a run of every example on a PC, as C++11 and C++17
#   lint        arduino-lint, the same check the Library Manager runs on submission
#   compile     every example on several boards, with all warnings
name: CI

on: [push, pull_request]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        std: [c++11, c++17]
    steps:
      - uses: actions/checkout@v7
      - run: make -C test run examples STD=${{ matrix.std }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/arduino-lint-action@v3
        with:
          library-manager: update   # change to "update" once the library is in the Library Manager
          compliance: strict

  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - fqbn: esp32:esp32:esp32s3
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - fqbn: arduino:samd:mkrzero
            platforms: |
              - name: arduino:samd
          - fqbn: arduino:mbed_rp2040:pico
            platforms: |
              - name: arduino:mbed_rp2040
          - fqbn: arduino:renesas_uno:minima
            platforms: |
              - name: arduino:renesas_uno
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          cli-compile-flags: |
            - --warnings
            - all
